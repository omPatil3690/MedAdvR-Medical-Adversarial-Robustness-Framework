[project]
name = "medadvr"
version = "0.1.0"
description = "MedAdvR: Medical Adversarial Robustness Framework for Medical Image Segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchmetrics>=1.0.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "matplotlib>=3.7.0",
    "pydicom>=2.4.0",
    "nibabel>=5.0.0",
    "kagglehub>=0.2.0",
]
